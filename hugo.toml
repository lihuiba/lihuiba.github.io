baseURL = "https://lihuiba.github.io/"
theme = "hugo-theme-stack"

defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true

enableRobotsTXT = true

[pagination]
    pagerSize = 5

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

# 只保留 tags，不生成 categories 分类页
[taxonomies]
    tag = "tags"

# 同一份 publications 内容挂载到中英两种语言
# 注意：自定义 mounts 后 Hugo 默认挂载全部失效，需显式补回
[module]
    [[module.mounts]]
        source = "content"
        target = "content"
    [[module.mounts]]
        source = "assets"
        target = "assets"
    [[module.mounts]]
        source = "layouts"
        target = "layouts"
    [[module.mounts]]
        source = "static"
        target = "static"
    [[module.mounts]]
        source = "data"
        target = "data"
    [[module.mounts]]
        source = "i18n"
        target = "i18n"
    [[module.mounts]]
        source = "archetypes"
        target = "archetypes"
    [[module.mounts]]
        source = "contentShared/publications"
        target = "content/page/publications"
        [module.mounts.sites.matrix]
            languages = ["zh", "en"]

[languages]
    [languages.zh]
        label  = "简体中文"
        locale = "zh-CN"
        title  = "云深不知处"
        weight = 1
        [languages.zh.params.sidebar]
            subtitle = "lihuiba 的博客"
        [[languages.zh.menu.main]]
            identifier = "publication"
            name       = "论文发表"
            url        = "/publications/"
            weight     = -65
            [languages.zh.menu.main.params]
                icon = "article"

    [languages.en]
        label  = "English"
        locale = "en-US"
        title  = "Deep in the clouds, I know not where."
        weight = 2
        [languages.en.params.sidebar]
            subtitle = "lihuiba's blog"
        [[languages.en.menu.main]]
            identifier = "publication"
            name       = "Publications"
            url        = "/en/publications/"
            weight     = -65
            [languages.en.menu.main.params]
                icon = "article"

[params]
    mainSections   = ["post"]
    rssFullContent = true
    favicon        = "https://github.com/lihuiba.png"

    [params.footer]
        since = 2026

    [params.sidebar]
        emoji    = "📝"
        subtitle = "记录技术与生活"

    [params.colorScheme]
        toggle = true

    [params.article]
        [params.article.license]
            enabled = true
            default  = "Licensed under [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)"

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "archives", params = { limit = 5 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]
        page = [{ type = "toc" }]

    [params.comments]
        enabled  = true
        provider = "giscus"

        [params.comments.giscus]
            repo             = "lihuiba/lihuiba.github.io"
            repoID           = "MDEwOlJlcG9zaXRvcnk2NzgxOTM="
            category         = "Announcements"
            categoryID       = "DIC_kwDOAApZMc4DC-a_"
            strict           = "1"
            reactionsEnabled = "1"
            emitMetadata     = "0"
            inputPosition    = "bottom"
            lightTheme       = "light"
            darkTheme        = "dark"
            loading          = "lazy"

[[menu.social]]
    identifier = "github"
    name       = "GitHub"
    url        = "https://github.com/lihuiba"

    [menu.social.params]
        icon = "brand-github"
