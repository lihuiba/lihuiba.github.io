<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="System structure">
  <rect x="0" y="0" width="960" height="460" rx="12" fill="#fcfcfe" stroke="#d8d8e0"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#212121">
    <!-- zones: two rows each, rows horizontally aligned -->
    <g fill="#f4f4f9" stroke="#c9c9d6" stroke-dasharray="6 4">
      <rect x="40" y="20" width="420" height="244" rx="10"/>
      <rect x="500" y="20" width="420" height="244" rx="10"/>
    </g>
    <g font-size="14" fill="#747474">
      <text x="56" y="44">host zone</text>
      <text x="516" y="44">guests zone</text>
    </g>
    <!-- row 1: taller boxes -->
    <g stroke="#34495e" stroke-width="1.5" fill="#ffffff">
      <rect x="60" y="59" width="390" height="80" rx="8"/>
      <rect x="520" y="59" width="120" height="80" rx="8"/>
      <rect x="650" y="59" width="120" height="80" rx="8"/>
      <rect x="780" y="59" width="120" height="80" rx="8"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="255" y="87">control-plane VM</text>
      <text x="580" y="91">user VM</text>
      <text x="710" y="91">user VM</text>
      <text x="840" y="91">user VM</text>
    </g>
    <g font-size="10.5" fill="#747474" text-anchor="middle">
      <text x="255" y="105">zero-state · carries the control plane</text>
      <text x="255" y="121">NIC VF passthrough · forwarding never stops across restarts</text>
      <text x="580" y="113">NIC VF passthrough</text>
      <text x="710" y="113">NIC VF passthrough</text>
      <text x="840" y="113">NIC VF passthrough</text>
    </g>
    <!-- virtio note between rows (guests zone) -->
    <g font-size="12" fill="#747474" text-anchor="middle">
      <text x="710" y="158">connected via virtio</text>
    </g>
    <!-- row 2: compressed boxes -->
    <g stroke="#34495e" stroke-width="1.5" fill="#ffffff">
      <rect x="60" y="172" width="390" height="56" rx="8"/>
      <rect x="520" y="172" width="190" height="56" rx="8"/>
      <rect x="720" y="172" width="190" height="56" rx="8"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="255" y="196">control-plane daemon</text>
      <text x="615" y="196">Block storage VM</text>
      <text x="815" y="196">File storage VM</text>
    </g>
    <g font-size="10.5" fill="#747474" text-anchor="middle">
      <text x="255" y="214">zero-state · writes flow tables · executes operations</text>
      <text x="615" y="214">NIC VF passthrough</text>
      <text x="815" y="214">NIC VF passthrough</text>
    </g>
    <!-- zone captions -->
    <g font-size="10.5" fill="#747474" text-anchor="middle">
      <text x="255" y="252">the NIC PF stays in the thin core; flow tables live in silicon</text>
      <text x="710" y="252">stateless; counts as needed; state in cluster control plane</text>
    </g>
    <!-- thin core: spans both zones, above hardware -->
    <g stroke="#34495e" stroke-width="1.5" fill="#ffffff">
      <rect x="40" y="284" width="880" height="64" rx="8"/>
    </g>
    <g font-size="15" text-anchor="middle">
      <text x="480" y="310">Thin core: trimmed Linux + KVM</text>
    </g>
    <g font-size="10.5" fill="#747474" text-anchor="middle">
      <text x="480" y="332">system firmware: versioned releases, livepatch as safety valve; holds the NIC PF and boot media; CPU/mem virt · IOMMU · interrupts</text>
    </g>
    <!-- hardware layer -->
    <g stroke="#34495e" stroke-width="1.5" fill="#ffffff">
      <rect x="40" y="378" width="260" height="60" rx="8"/>
      <rect x="320" y="378" width="260" height="60" rx="8"/>
      <rect x="600" y="378" width="320" height="60" rx="8"/>
    </g>
    <g font-size="15" text-anchor="middle">
      <text x="170" y="413">CPU</text>
      <text x="450" y="413">Memory</text>
      <text x="760" y="403">NIC</text>
    </g>
    <g font-size="10.5" fill="#747474" text-anchor="middle">
      <text x="760" y="423">eswitch = dataplane</text>
    </g>
  </g>
</svg>
